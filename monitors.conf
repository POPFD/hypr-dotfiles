################
### MONITORS ###
################
# Matched by manufacturer (desc: does substring matching) so port names don't matter.
# Samsung Odyssey G80SD (4K) — primary, left
monitor = desc:Samsung, 3840x2160@239, 0x0, 1
# Dell S2721NX (1080p) — right
monitor = desc:Dell, 1920x1080@60, 3840x0, 1

# Pin a default workspace to each monitor so the layout is deterministic on every
# boot — otherwise whichever monitor Hyprland focuses first at startup grabs the
# next free workspace, drifting the numbering and spawning windows on the Dell.
workspace = 1, monitor:desc:Samsung, default:true
workspace = 2, monitor:desc:Dell, default:true
